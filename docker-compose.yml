services:

  db:
    image: postgres:16

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7

    ports:
      - "6379:6379"


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    command: uv run python manage.py runserver 0.0.0.0:8000

    volumes:
      - ./:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      RUN_MIGRATIONS: "1"
      RUN_CREATE_SUPERUSER: "1"

    depends_on:
      - db
      - redis


  celery:
    build:
      context: .
      dockerfile: Dockerfile

    command: uv run celery -A config worker --loglevel=info

    volumes:
      - ./:/app

    ports: []

    env_file:
      - .env

    environment:
      RUN_MIGRATIONS: "0"
      RUN_CREATE_SUPERUSER: "0"

    depends_on:
      - db
      - redis


volumes:
  postgres_data: