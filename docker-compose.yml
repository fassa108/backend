services:

  db:
    image: postgres:16

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7

    ports:
      - "6379:6379"


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    command: uv run python manage.py runserver 0.0.0.0:8000

    volumes:
      - ./:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      RUN_MIGRATIONS: "1"
      RUN_CREATE_SUPERUSER: "1"

    depends_on:
      - db
      - redis


  celery:
    build:
      context: .
      dockerfile: Dockerfile

    command: uv run celery -A config worker --loglevel=info

    volumes:
      - ./:/app

    ports: []

    env_file:
      - .env

    environment:
      RUN_MIGRATIONS: "0"
      RUN_CREATE_SUPERUSER: "0"

    depends_on:
      - db
      - redis
      - gotenberg
      - ia

    # « apercus » : seul chemin vers Gotenberg ; « ia » : seul chemin vers le service IA
    networks:
      - default
      - apercus
      - ia


  # Conversion des fichiers Office (docx, pptx) en PDF pour leur aperçu.
  # Isolé : réseau interne sans accès à internet, joignable seulement par
  # Celery ; aucun port publié ; pas d'accès à la base ni aux secrets.
  # Seule la route LibreOffice est active (pas de Chromium, de webhook ni de
  # téléchargement d'URL).
  gotenberg:
    image: gotenberg/gotenberg:8

    command:
      - gotenberg
      - --chromium-disable-routes=true
      - --webhook-disable=true
      - --api-disable-download-from=true
      - --api-timeout=120s
      - --libreoffice-max-queue-size=20
      - --libreoffice-restart-after=10

    networks:
      - apercus

    restart: unless-stopped


  # Service IA (génération de quiz), dépôt voisin eduhub_fastapi.
  # Joignable seulement par Celery, via le réseau interne « ia » ; aucun port
  # publié ; pas d'accès à la base ni à Redis. « ia_sortie » ne sert qu'à
  # joindre l'API Gemini. Les appels exigent le jeton partagé (X-Service-Token).
  ia:
    build:
      context: ../eduhub_fastapi
      dockerfile: Dockerfile

    env_file:
      - ../eduhub_fastapi/.env

    networks:
      - ia
      - ia_sortie

    restart: unless-stopped


networks:
  default:
  apercus:
    internal: true
  ia:
    internal: true
  ia_sortie:


volumes:
  postgres_data: